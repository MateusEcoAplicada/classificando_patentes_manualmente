<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classificador de Patentes | 250 Patentes BR</title>
  <meta name="description" content="Ferramenta para classificação manual de patentes brasileiras em inovação de processo ou produto." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080c18;
      --bg2: #0f1526;
      --bg3: #161e35;
      --bg4: #1c2640;
      --border: rgba(99,102,241,0.14);
      --border2: rgba(99,102,241,0.3);

      --indigo: #6366f1;
      --indigo-l: #818cf8;
      --violet: #8b5cf6;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --sky: #38bdf8;
      --slate: #94a3b8;

      --c-produto: #10b981;
      --c-processo: #6366f1;
      --c-indefinido: #f59e0b;

      --t1: #f1f5f9;
      --t2: #94a3b8;
      --t3: #64748b;

      --r: 12px;
      --r-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--t1);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── BG Glow ─── */
    body::before {
      content: '';
      position: fixed;
      top: -150px; left: 50%;
      transform: translateX(-50%);
      width: 1000px; height: 500px;
      background: radial-gradient(ellipse, rgba(99,102,241,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── TOPBAR ─── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,12,24,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      height: 60px;
    }

    .topbar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--t1);
      white-space: nowrap;
    }

    .topbar-logo .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--indigo);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:.4; transform:scale(.8); }
    }

    .progress-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-bar-bg {
      flex: 1;
      height: 6px;
      background: rgba(99,102,241,0.12);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--indigo), var(--violet));
      border-radius: 100px;
      transition: width 0.4s ease;
    }

    .progress-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--indigo-l);
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
    }

    .chips {
      display: flex;
      gap: 8px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid;
      white-space: nowrap;
    }

    .chip-produto { background: rgba(16,185,129,.1); border-color: rgba(16,185,129,.3); color: var(--c-produto); }
    .chip-processo { background: rgba(99,102,241,.1); border-color: rgba(99,102,241,.3); color: var(--c-processo); }
    .chip-indefinido { background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.3); color: var(--c-indefinido); }
    .chip-pendente { background: rgba(100,116,139,.08); border-color: rgba(100,116,139,.2); color: var(--t3); }

    /* ─── LAYOUT ─── */
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 60px);
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; height: auto; }
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg2);
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 9px 12px;
      color: var(--t1);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .search-input:focus {
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-btn {
      flex: 1 1 auto;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--t3);
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .05em;
      transition: all .2s;
    }

    .filter-btn:hover { color: var(--t2); border-color: var(--border2); }

    .filter-btn.active-produto {
      background: rgba(16,185,129,.12);
      border-color: rgba(16,185,129,.35);
      color: var(--c-produto);
    }

    .filter-btn.active-processo {
      background: rgba(99,102,241,.12);
      border-color: rgba(99,102,241,.35);
      color: var(--c-processo);
    }

    .filter-btn.active-indefinido {
      background: rgba(245,158,11,.12);
      border-color: rgba(245,158,11,.35);
      color: var(--c-indefinido);
    }

    .filter-btn.active-all {
      background: rgba(99,102,241,.1);
      border-color: var(--border2);
      color: var(--indigo-l);
    }

    /* Patent list */
    .patent-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .patent-list::-webkit-scrollbar { width: 4px; }
    .patent-list::-webkit-scrollbar-track { background: transparent; }
    .patent-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .patent-item {
      padding: 12px 14px;
      border-radius: var(--r-sm);
      border: 1px solid transparent;
      cursor: pointer;
      margin-bottom: 4px;
      transition: all .18s;
      position: relative;
    }

    .patent-item:hover { background: var(--bg3); border-color: var(--border); }
    .patent-item.active { background: var(--bg4); border-color: var(--border2); }

    .patent-item::before {
      content: '';
      position: absolute;
      left: 0; top: 8px; bottom: 8px;
      width: 2px;
      border-radius: 2px;
      opacity: 0;
      transition: opacity .2s;
    }

    .patent-item.active::before { opacity: 1; }
    .patent-item.cls-produto::before { background: var(--c-produto); }
    .patent-item.cls-processo::before { background: var(--c-processo); }
    .patent-item.cls-indefinido::before { background: var(--c-indefinido); }

    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .item-num {
      font-size: 10px;
      font-weight: 700;
      color: var(--t3);
      font-family: 'JetBrains Mono', monospace;
    }

    .item-pill {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 100px;
      border: 1px solid;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .pill-produto { background: rgba(16,185,129,.1); border-color: rgba(16,185,129,.3); color: var(--c-produto); }
    .pill-processo { background: rgba(99,102,241,.1); border-color: rgba(99,102,241,.3); color: var(--c-processo); }
    .pill-indefinido { background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.3); color: var(--c-indefinido); }
    .pill-pending { background: rgba(100,116,139,.08); border-color: rgba(100,116,139,.15); color: var(--t3); }

    .item-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--t2);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .patent-item.active .item-title { color: var(--t1); }

    /* ─── MAIN ─── */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Navigation bar */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-shrink: 0;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--t2);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--bg3);
      border-color: var(--border2);
      color: var(--t1);
    }

    .nav-btn:disabled { opacity: .3; cursor: not-allowed; }

    .nav-counter {
      font-size: 13px;
      font-weight: 700;
      color: var(--t2);
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-counter span { color: var(--indigo-l); }

    /* Patent detail */
    .detail {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }

    .detail::-webkit-scrollbar { width: 5px; }
    .detail::-webkit-scrollbar-track { background: transparent; }
    .detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .detail-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--t3);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .detail-id .ipc-badge {
      background: rgba(56,189,248,.1);
      border: 1px solid rgba(56,189,248,.2);
      color: var(--sky);
      padding: 2px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
    }

    .detail-title {
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 700;
      color: var(--t1);
      line-height: 1.3;
      margin-bottom: 20px;
    }

    /* Scores */
    .scores-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .score-card {
      flex: 1;
      min-width: 160px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 14px 16px;
    }

    .score-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--t3);
      margin-bottom: 6px;
    }

    .score-value {
      font-size: 22px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }

    .score-bar {
      height: 4px;
      border-radius: 100px;
      margin-top: 8px;
      background: rgba(99,102,241,.1);
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 100px;
    }

    .s-processo .score-value { color: var(--c-processo); }
    .s-processo .score-bar-fill { background: var(--c-processo); }
    .s-produto .score-value { color: var(--c-produto); }
    .s-produto .score-bar-fill { background: var(--c-produto); }

    .s-auto {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }

    .auto-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--t3);
    }

    /* Abstract */
    .abstract-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 20px 22px;
      margin-bottom: 24px;
    }

    .abstract-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--t3);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .abstract-heading::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .abstract-text {
      font-size: 14px;
      line-height: 1.75;
      color: var(--t2);
    }

    /* Classify panel */
    .classify-panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 20px 22px;
      margin-bottom: 24px;
    }

    .classify-heading {
      font-size: 13px;
      font-weight: 700;
      color: var(--t1);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .classify-btns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .cls-btn {
      padding: 16px 12px;
      border-radius: var(--r-sm);
      border: 2px solid;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all .2s;
    }

    .cls-btn .cls-icon { font-size: 24px; }
    .cls-btn .cls-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }

    .cls-btn-produto {
      background: rgba(16,185,129,.06);
      border-color: rgba(16,185,129,.25);
      color: #6ee7b7;
    }

    .cls-btn-produto:hover, .cls-btn-produto.selected {
      background: rgba(16,185,129,.18);
      border-color: var(--c-produto);
      box-shadow: 0 0 20px rgba(16,185,129,.2);
      transform: translateY(-2px);
    }

    .cls-btn-processo {
      background: rgba(99,102,241,.06);
      border-color: rgba(99,102,241,.25);
      color: #a5b4fc;
    }

    .cls-btn-processo:hover, .cls-btn-processo.selected {
      background: rgba(99,102,241,.18);
      border-color: var(--c-processo);
      box-shadow: 0 0 20px rgba(99,102,241,.25);
      transform: translateY(-2px);
    }

    .cls-btn-indefinido {
      background: rgba(245,158,11,.06);
      border-color: rgba(245,158,11,.25);
      color: #fcd34d;
    }

    .cls-btn-indefinido:hover, .cls-btn-indefinido.selected {
      background: rgba(245,158,11,.18);
      border-color: var(--c-indefinido);
      box-shadow: 0 0 20px rgba(245,158,11,.2);
      transform: translateY(-2px);
    }

    /* Note */
    .note-wrap { margin-bottom: 24px; }

    .note-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--t3);
      margin-bottom: 8px;
    }

    .note-input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 10px 14px;
      color: var(--t2);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      resize: vertical;
      min-height: 60px;
      transition: border-color .2s;
    }

    .note-input:focus { border-color: var(--indigo); color: var(--t1); }

    /* Bottom action bar */
    .action-bar {
      padding: 16px 32px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
      background: rgba(8,12,24,.8);
      backdrop-filter: blur(8px);
    }

    .save-btn {
      flex: 1;
      max-width: 220px;
      padding: 12px 24px;
      border-radius: var(--r-sm);
      border: none;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .save-btn:hover {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(99,102,241,.4);
    }

    .skip-btn {
      padding: 12px 20px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--t3);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }

    .skip-btn:hover { background: var(--bg3); color: var(--t2); border-color: var(--border2); }

    .export-btn {
      margin-left: auto;
      padding: 10px 14px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--t3);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .export-btn:hover { background: var(--bg3); color: var(--t1); border-color: var(--border2); }

    /* ─── Empty / Loading ─── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--t3);
      gap: 16px;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--indigo);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-detail {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--t3);
      text-align: center;
      gap: 12px;
    }

    .empty-detail .icon { font-size: 48px; opacity: .4; }
    .empty-detail p { font-size: 14px; }

    /* ─── Toast ─── */
    #toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--r-sm);
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--t1);
      z-index: 999;
      opacity: 0;
      transform: translateY(12px);
      transition: all .25s;
      pointer-events: none;
      max-width: 320px;
    }

    #toast.show { opacity: 1; transform: translateY(0); }

    /* Keyboard hint */
    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--t3);
      padding: 1px 5px;
      min-width: 20px;
    }

    .kbd-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--t3);
      flex-wrap: wrap;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail { animation: fadeSlide .25s ease; }

    /* ─── Abas ─── */
    .tabs { display: flex; gap: 4px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    .tab-btn { padding: 6px 14px; border-radius: 7px; border: none; background: transparent; color: var(--t3); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .2s; }
    .tab-btn:hover { color: var(--t1); }
    .tab-btn.active { background: var(--bg4); color: var(--t1); box-shadow: 0 0 0 1px var(--border2); }
    body.view-guia .progress-wrap, body.view-guia .chips { visibility: hidden; }
    .hidden { display: none !important; }

    /* ─── Guia ─── */
    .guia-layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 60px); }
    @media (max-width: 900px) { .guia-layout { grid-template-columns: 1fr; height: auto; } }
    .guia-nav { border-right: 1px solid var(--border); background: var(--bg2); overflow-y: auto; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; }
    .guia-nav-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--t3); padding: 8px 10px 4px; }
    .guia-item { text-align: left; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid transparent; background: transparent; color: var(--t2); font-family: 'Inter', sans-serif; font-size: 12.5px; line-height: 1.4; cursor: pointer; transition: all .18s; }
    .guia-item:hover { background: var(--bg3); border-color: var(--border); }
    .guia-item.active { background: var(--bg4); border-color: var(--border2); color: var(--t1); }
    .guia-item .divs { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--sky); margin-bottom: 3px; }
    .guia-item .count { display: block; font-size: 10px; color: var(--t3); margin-top: 4px; }
    .guia-main { overflow-y: auto; padding: 28px 32px 48px; }
    .guia-head { margin-bottom: 22px; }
    .guia-head h2 { font-size: clamp(17px, 2.3vw, 22px); font-weight: 700; line-height: 1.3; margin-bottom: 10px; }
    .div-chip { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--sky); background: rgba(56,189,248,.1); border: 1px solid rgba(56,189,248,.2); border-radius: 100px; padding: 2px 9px; margin: 0 4px 4px 0; }
    .guia-search { max-width: 420px; margin-top: 6px; }
    .guia-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 1100px) { .guia-cols { grid-template-columns: 1fr; } }
    .guia-col { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; border-top: 3px solid; }
    .guia-col.proc { border-top-color: var(--c-processo); }
    .guia-col.prod { border-top-color: var(--c-produto); }
    .guia-col h3 { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 14px; }
    .guia-col.proc h3 { color: #a5b4fc; }
    .guia-col.prod h3 { color: #6ee7b7; }
    .guia-col ol { padding-left: 22px; display: flex; flex-direction: column; gap: 12px; }
    .guia-col li { font-size: 14px; line-height: 1.65; color: #cbd5e1; }
    .guia-col li::marker { color: var(--t3); font-weight: 700; font-size: 12px; }
    .guia-col p { font-size: 14px; line-height: 1.75; color: #cbd5e1; margin-bottom: 10px; }
    .guia-col .ex { color: #8391a7; }
    .guia-col mark { background: rgba(245,158,11,.25); color: #fde68a; border-radius: 3px; padding: 0 1px; }
    .guia-empty { color: var(--t3); font-size: 13px; font-style: italic; }

    /* ─── Painel de critérios na tela de classificação ─── */
    .crit-box { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 24px; }
    .crit-box > summary { list-style: none; cursor: pointer; padding: 14px 22px; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: var(--t2); user-select: none; }
    .crit-box > summary::-webkit-details-marker { display: none; }
    .crit-box > summary .arrow { transition: transform .2s; color: var(--t3); }
    .crit-box[open] > summary .arrow { transform: rotate(90deg); }
    .crit-box > summary .sector { font-weight: 500; color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .crit-box > summary .open-guia { margin-left: auto; font-size: 11px; color: var(--indigo-l); background: none; border: none; cursor: pointer; font-family: inherit; font-weight: 600; white-space: nowrap; }
    .crit-box > summary .open-guia:hover { text-decoration: underline; }
    .crit-body { padding: 0 22px 20px; }
    .crit-body .guia-col { padding: 14px 16px; }
    .crit-body .guia-col li, .crit-body .guia-col p { font-size: 13px; line-height: 1.6; }
    .crit-body .guia-col ol { gap: 8px; }

    .hl-toggle { font-size: 11px; color: var(--t3); display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .hl-toggle input { accent-color: var(--indigo); }
    mark.kw-proc { background: rgba(99,102,241,.22); color: #c7d2fe; border-radius: 3px; padding: 0 2px; }
    mark.kw-prod { background: rgba(16,185,129,.2); color: #a7f3d0; border-radius: 3px; padding: 0 2px; }
    .abstract-text { color: #cbd5e1; font-size: 15px; }
    .missing { color: var(--amber); font-style: italic; font-size: 13px; }
    .saved-flag { font-size: 11px; color: var(--t3); margin-left: 8px; font-weight: 500; }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-logo">
    <div class="dot"></div>
    Classificador de Patentes BR
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tab-classificar" onclick="showView('classificar')">🏷️ Classificar</button>
    <button class="tab-btn" id="tab-guia" onclick="showView('guia')">📖 Guia de critérios</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progress-label">0 / 250</div>
  </div>
  <div class="chips">
    <div class="chip chip-produto"><span id="cnt-produto">0</span> Produto</div>
    <div class="chip chip-processo"><span id="cnt-processo">0</span> Processo</div>
    <div class="chip chip-indefinido"><span id="cnt-indefinido">0</span> Ambígua</div>
    <div class="chip chip-pendente"><span id="cnt-pendente">250</span> Pendente</div>
  </div>
</div>

<!-- Layout -->
<div class="layout" id="view-classificar">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <input class="search-input" id="search" placeholder="🔍  Buscar por título, número ou resumo..." oninput="filterList()" />
      <div class="filter-row">
        <button class="filter-btn active-all" id="f-all" onclick="setFilter('all', this)">Todas</button>
        <button class="filter-btn" id="f-produto" onclick="setFilter('produto', this)">Produto</button>
        <button class="filter-btn" id="f-processo" onclick="setFilter('processo', this)">Processo</button>
        <button class="filter-btn" id="f-indefinido" onclick="setFilter('indefinido', this)">Ambígua</button>
        <button class="filter-btn" id="f-pending" onclick="setFilter('pending', this)">Pendente</button>
      </div>
      <label class="hl-toggle"><input type="checkbox" id="hl-toggle" checked onchange="if(currentIdx>=0) renderDetail(patents[currentIdx])"/> Destacar palavras-chave (<span style="color:#a5b4fc">processo</span> / <span style="color:#6ee7b7">produto</span>)</label>
      <div style="display:none">
      </div>
    </div>
    <div class="patent-list" id="patent-list">
      <div class="loading"><div class="spinner"></div><p>Carregando patentes...</p></div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Nav bar -->
    <div class="nav-bar">
      <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" disabled>← Anterior</button>
      <span class="nav-counter" id="nav-counter"><span>—</span> / 250</span>
      <button class="nav-btn" id="btn-next" onclick="navigate(1)">Próxima →</button>
      <div style="flex:1;"></div>
      <div class="kbd-row">
        <kbd class="kbd">1</kbd> Produto &nbsp;
        <kbd class="kbd">2</kbd> Processo &nbsp;
        <kbd class="kbd">3</kbd> Ambígua &nbsp;
        <kbd class="kbd">Enter</kbd> Salvar &nbsp;
        <kbd class="kbd">→</kbd> Próxima
      </div>
    </div>

    <!-- Detail -->
    <div class="detail" id="detail">
      <div class="empty-detail">
        <div class="icon">📋</div>
        <p>Selecione uma patente na lista<br/>ou use as setas para navegar.</p>
      </div>
    </div>

    <!-- Action bar -->
    <div class="action-bar">
      <button class="save-btn" id="save-btn" onclick="saveAndNext()">💾 Salvar e Avançar</button>
      <button class="skip-btn" onclick="navigate(1)">Pular →</button>
      <button class="export-btn" onclick="exportCSV()">📥 Exportar CSV</button>
      <button class="export-btn" style="margin-left:0" onclick="exportJSON()">📋 Backup JSON</button>
      <button class="export-btn" style="margin-left:0" onclick="document.getElementById('import-file').click()">📂 Importar</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(this)" />
    </div>
  </div>
</div>

<!-- Guia de critérios -->
<div class="guia-layout hidden" id="view-guia">
  <div class="guia-nav" id="guia-nav"></div>
  <div class="guia-main" id="guia-main"></div>
</div>

<div id="toast"></div>

<script src="patentes250.js"></script>
<script src="setores.js"></script>
<script>
  // ─── State ───────────────────────────────────────────────────
  let patents = [];
  let classifications = JSON.parse(localStorage.getItem('patent-cls-250') || '{}');
  let notes = JSON.parse(localStorage.getItem('patent-notes-250') || '{}');
  let currentIdx = -1;
  let currentFilter = 'all';
  let filteredIds = [];
  let pendingCls = '';

  // ─── Load data ───────────────────────────────────────────────
  const loadData = window.PATENTES
    ? Promise.resolve(window.PATENTES)
    : fetch('./patentes250.json').then(r => r.json());
  loadData
    .then(data => {
      patents = data;
      filteredIds = patents.map(p => p.uid);
      renderList();
      updateStats();
      if (patents.length > 0) {
        const firstPending = patents.findIndex(p => !classifications[p.uid]);
        selectPatent(firstPending === -1 ? 0 : firstPending);
      }
    })
    .catch(e => {
      document.getElementById('patent-list').innerHTML =
        '<div class="loading"><p>⚠️ Erro ao carregar patentes250.json.<br/>Verifique se o arquivo patentes250.js está na mesma pasta do index.html.</p></div>';
    });

  // ─── Render list ─────────────────────────────────────────────
  function renderList() {
    const q = document.getElementById('search').value.toLowerCase();
    filteredIds = patents
      .filter(p => {
        if (currentFilter === 'pending' && classifications[p.uid]) return false;
        if (currentFilter === 'produto' && classifications[p.uid] !== 'produto') return false;
        if (currentFilter === 'processo' && classifications[p.uid] !== 'processo') return false;
        if (currentFilter === 'indefinido' && classifications[p.uid] !== 'indefinido') return false;
        if (q && !p.title.toLowerCase().includes(q) && !p.id.toLowerCase().includes(q) && !p.abstract.toLowerCase().includes(q)) return false;
        return true;
      })
      .map(p => p.uid);

    const list = document.getElementById('patent-list');
    if (filteredIds.length === 0) {
      list.innerHTML = '<div class="loading"><p style="font-size:13px">Nenhuma patente encontrada.</p></div>';
      return;
    }

    list.innerHTML = filteredIds.map((uid, i) => {
      const p = patents.find(x => x.uid === uid);
      const cls = classifications[uid] || '';
      const isActive = currentIdx !== -1 && patents[currentIdx]?.uid === uid;
      return `
        <div class="patent-item ${cls ? 'cls-' + cls : ''} ${isActive ? 'active' : ''}"
             id="item-${uid}" onclick="selectByUid(${uid})">
          <div class="item-top">
            <span class="item-num">#${uid} · ${p.id.slice(0,18)}</span>
            ${cls
              ? `<span class="item-pill pill-${cls}">${cls === 'produto' ? 'Produto' : cls === 'processo' ? 'Processo' : 'Ambígua'}</span>`
              : `<span class="item-pill pill-pending">Pendente</span>`}
          </div>
          <div class="item-title">${esc(p.title)}</div>
        </div>
      `;
    }).join('');
  }

  // ─── Select patent ───────────────────────────────────────────
  function selectPatent(idx) {
    if (idx < 0 || idx >= patents.length) return;
    currentIdx = idx;
    pendingCls = classifications[patents[idx].uid] || '';
    renderDetail(patents[idx]);
    updateNavBtns();
    scrollToActive();
    renderList();
  }

  function selectByUid(uid) {
    const idx = patents.findIndex(p => p.uid === uid);
    if (idx !== -1) selectPatent(idx);
  }

  function renderDetail(p) {
    const cls = classifications[p.uid] || '';
    const note = notes[p.uid] || '';
    const autoMap = { 'Inovação de Processo': 'processo', 'Inovação de Produto': 'produto' };
    const autoCls = autoMap[p.auto_class] || '';

    document.getElementById('nav-counter').innerHTML =
      `<span>${currentIdx + 1}</span> / ${patents.length}`;

    const sp = (p.sim_processo * 100).toFixed(1);
    const sprod = (p.sim_produto * 100).toFixed(1);
    const diff = (p.diferenca * 100).toFixed(1);

    document.getElementById('detail').innerHTML = `
      <div class="detail-id">
        ${esc(p.id)}
        <span class="ipc-badge">IPC ${esc(p.ipc)}</span>
        <span class="ipc-badge" style="background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.18);color:#a5b4fc;">ISIC ${esc(p.isic)}</span>
        ${p.filing_date ? `<span>Depósito ${fmtDate(p.filing_date)}</span>` : ''}
      </div>

      <div class="detail-title">${highlight(esc(p.title))}</div>

      <div class="scores-row">
        <div class="score-card">
          <div class="auto-label">Classificação automática</div>
          <div style="margin-top:10px;">
            ${autoCls
              ? `<span class="item-pill pill-${autoCls}" style="font-size:11px;padding:4px 12px;">${p.auto_class}</span>`
              : `<span style="color:var(--t3);font-size:12px;">—</span>`}
          </div>
          <div style="margin-top:10px; font-size:11px; color:var(--t3);">Δ ${diff > 0 ? '+' : ''}${diff}%</div>
        </div>
      </div>

      <div class="abstract-box">
        <div class="abstract-heading">Resumo / Reivindicação Principal</div>
        <div class="abstract-text">${p.abstract ? highlight(esc(p.abstract)) : '<span class="missing">⚠️ Resumo indisponível na base de dados para esta patente. Classifique pelo título ou consulte o documento original no INPI.</span>'}</div>
      </div>

      ${critPanel(p)}

      <div class="classify-panel">
        <div class="classify-heading">🏷️ Sua classificação ${cls ? `<span class="saved-flag">(salva: ${LABELS[cls]})</span>` : ''}</div>
        <div class="classify-btns">
          <button class="cls-btn cls-btn-produto ${pendingCls === 'produto' ? 'selected' : ''}"
                  id="cb-produto" onclick="selectCls('produto')">
            <span class="cls-icon">🟢</span>
            <span class="cls-label">Inovação de Produto</span>
          </button>
          <button class="cls-btn cls-btn-processo ${pendingCls === 'processo' ? 'selected' : ''}"
                  id="cb-processo" onclick="selectCls('processo')">
            <span class="cls-icon">🟣</span>
            <span class="cls-label">Inovação de Processo</span>
          </button>
          <button class="cls-btn cls-btn-indefinido ${pendingCls === 'indefinido' ? 'selected' : ''}"
                  id="cb-indefinido" onclick="selectCls('indefinido')">
            <span class="cls-icon">🟡</span>
            <span class="cls-label">Ambígua</span>
          </button>
        </div>
      </div>

      <div class="note-wrap">
        <div class="note-label">Observação (opcional)</div>
        <textarea class="note-input" id="note-input" placeholder="Adicione uma observação sobre essa patente..."
          oninput="notes[${p.uid}] = this.value; saveLocal();">${esc(note)}</textarea>
      </div>
    `;
  }

  function selectCls(cls) {
    pendingCls = cls;
    ['produto', 'processo', 'indefinido'].forEach(c => {
      const btn = document.getElementById('cb-' + c);
      if (btn) btn.classList.toggle('selected', c === cls);
    });
  }

  function saveAndNext() {
    if (currentIdx < 0) return;
    const p = patents[currentIdx];
    if (!pendingCls) { showToast('⚠️ Selecione uma classificação primeiro.', true); return; }
    classifications[p.uid] = pendingCls;
    const noteEl = document.getElementById('note-input');
    if (noteEl) notes[p.uid] = noteEl.value;
    saveLocal();
    updateStats();
    renderList();
    showToast(`✅ #${p.uid} → ${LABELS[pendingCls]}`);
    // Advance
    if (currentIdx < patents.length - 1) selectPatent(currentIdx + 1);
  }

  function navigate(dir) {
    const next = currentIdx + dir;
    if (next >= 0 && next < patents.length) selectPatent(next);
  }

  function updateNavBtns() {
    document.getElementById('btn-prev').disabled = currentIdx <= 0;
    document.getElementById('btn-next').disabled = currentIdx >= patents.length - 1;
  }

  function scrollToActive() {
    if (currentIdx < 0) return;
    const uid = patents[currentIdx]?.uid;
    const el = document.getElementById('item-' + uid);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // ─── Filter ──────────────────────────────────────────────────
  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.className = 'filter-btn';
    });
    el.classList.add('active-' + (f === 'pending' ? 'all' : f === 'all' ? 'all' : f));
    renderList();
  }

  function filterList() { renderList(); }

  // ─── Stats ───────────────────────────────────────────────────
  function updateStats() {
    const vals = Object.values(classifications);
    const produto = vals.filter(v => v === 'produto').length;
    const processo = vals.filter(v => v === 'processo').length;
    const indefinido = vals.filter(v => v === 'indefinido').length;
    const done = produto + processo + indefinido;
    const pending = patents.length - done;

    document.getElementById('cnt-produto').textContent = produto;
    document.getElementById('cnt-processo').textContent = processo;
    document.getElementById('cnt-indefinido').textContent = indefinido;
    document.getElementById('cnt-pendente').textContent = pending;

    const pct = patents.length > 0 ? (done / patents.length * 100) : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent = `${done} / ${patents.length}`;
  }

  // ─── Persist ─────────────────────────────────────────────────
  function saveLocal() {
    localStorage.setItem('patent-cls-250', JSON.stringify(classifications));
    localStorage.setItem('patent-notes-250', JSON.stringify(notes));
  }

  // ─── Export ──────────────────────────────────────────────────
  function exportCSV() {
    if (!patents.length) { showToast('Nenhuma patente carregada.', true); return; }
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const num = v => String(v).replace('.', ',');
    const header = ['uid', 'publication_number', 'filing_date', 'title', 'abstract', 'ipc', 'isic', 'sim_processo', 'sim_produto', 'diferenca', 'classificacao_automatica', 'classificacao_manual', 'observacao'];
    const rows = patents.map(p => [
      p.uid, q(p.id), q(p.filing_date), q(p.title), q(p.abstract), q(p.ipc), q(p.isic),
      num(p.sim_processo), num(p.sim_produto), num(p.diferenca),
      q(p.auto_class), q(classifications[p.uid] ? LABELS_FULL[classifications[p.uid]] : ''), q(notes[p.uid] || ''),
    ]);
    const csv = [header.join(';'), ...rows.map(r => r.join(';'))].join('\r\n');
    download('patentes250_classificadas.csv', '\uFEFF' + csv, 'text/csv;charset=utf-8');
    showToast('CSV exportado com sucesso!');
  }

  function importJSON(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        let n = 0;
        data.forEach(r => {
          const key = r.uid ?? patents.find(p => p.id === r.id)?.uid;
          if (key == null) return;
          if (['produto', 'processo', 'indefinido'].includes(r.classificacao_manual)) { classifications[key] = r.classificacao_manual; n++; }
          if (r.observacao) notes[key] = r.observacao;
        });
        saveLocal(); updateStats(); renderList();
        if (currentIdx >= 0) selectPatent(currentIdx);
        showToast(`📂 ${n} classificações importadas.`);
      } catch (e) { showToast('⚠️ Arquivo JSON inválido.', true); }
      input.value = '';
    };
    reader.readAsText(file, 'utf-8');
  }

  function exportJSON() {
    if (!patents.length) return;
    const out = patents.map(p => ({
      ...p,
      classificacao_manual: classifications[p.uid] || '',
      observacao: notes[p.uid] || '',
    }));
    download('patentes250_classificadas.json', JSON.stringify(out, null, 2), 'application/json');
    showToast('JSON exportado com sucesso!');
  }

  function download(name, content, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type }));
    a.download = name;
    a.click();
  }

  // ─── Keyboard shortcuts ──────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (currentView !== 'classificar') return;
    if (e.key === '1') selectCls('produto');
    else if (e.key === '2') selectCls('processo');
    else if (e.key === '3') selectCls('indefinido');
    else if (e.key === 'Enter') saveAndNext();
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') navigate(-1);
  });

  // ─── Toast ───────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, warn = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderColor = warn ? 'rgba(245,158,11,.4)' : 'rgba(99,102,241,.3)';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ─── Guia de critérios ───────────────────────────────────────
  const GUIA = window.SETORES || null;
  let currentView = 'classificar';
  let guiaSel = 'geral';

  // Divisão CNAE (coluna ISIC) -> grupos da guia
  function gruposDoSetor(isic) {
    if (!GUIA) return [];
    const d = String(isic || '').trim();
    return GUIA.grupos
      .map((g, i) => ({ g, i }))
      .filter(({ g }) => g.divisoes.some(x => x === d || x.split('.')[0] === d));
  }

  function showView(v) {
    currentView = v;
    document.getElementById('view-classificar').classList.toggle('hidden', v !== 'classificar');
    document.getElementById('view-guia').classList.toggle('hidden', v !== 'guia');
    document.getElementById('tab-classificar').classList.toggle('active', v === 'classificar');
    document.getElementById('tab-guia').classList.toggle('active', v === 'guia');
    document.body.classList.toggle('view-guia', v === 'guia');
    if (v === 'guia') renderGuia();
  }

  function abrirGuia(sel, ev) {
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
    guiaSel = sel;
    showView('guia');
  }

  function fmtItem(txt, q) {
    // exemplos entre parênteses em tom mais claro
    let h = esc(txt).replace(/\((?:[^()]|\([^()]*\))*\)/g, m => `<span class="ex">${m}</span>`);
    if (q) {
      const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      h = h.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, txt2) => tag ? tag : txt2.replace(re, '<mark>$1</mark>'));
    }
    return h;
  }

  function colunas(g, q) {
    const lista = (arr) => {
      const its = arr.filter(t => !q || t.toLowerCase().includes(q.toLowerCase()));
      return its.length
        ? `<ol>${its.map(t => `<li>${fmtItem(t, q)}</li>`).join('')}</ol>`
        : `<div class="guia-empty">Nenhum critério contém “${esc(q)}”.</div>`;
    };
    return `
      <div class="guia-cols">
        <div class="guia-col proc"><h3>🟣 Inovação de Processo</h3>${lista(g.processo)}</div>
        <div class="guia-col prod"><h3>🟢 Inovação de Produto</h3>${lista(g.produto)}</div>
      </div>`;
  }

  function colunasGerais(q) {
    const par = t => t.split(/(?<=\.)\s+(?=[A-ZÁÉÍÓÚ])/).map(x => `<p>${fmtItem(x, q)}</p>`).join('');
    return `
      <div class="guia-cols">
        <div class="guia-col proc"><h3>🟣 Inovação de Processo</h3>${par(GUIA.geral.processo)}</div>
        <div class="guia-col prod"><h3>🟢 Inovação de Produto</h3>${par(GUIA.geral.produto)}</div>
      </div>`;
  }

  function renderGuia() {
    const nav = document.getElementById('guia-nav');
    const main = document.getElementById('guia-main');
    if (!GUIA) {
      main.innerHTML = '<div class="empty-detail"><div class="icon">📖</div><p>Arquivo setores.js não encontrado na pasta do site.</p></div>';
      return;
    }
    const contaPat = idx => patents.filter(p => gruposDoSetor(p.isic).some(x => x.i === idx)).length;
    nav.innerHTML = `
      <div class="guia-nav-title">Conceitos</div>
      <button class="guia-item ${guiaSel === 'geral' ? 'active' : ''}" onclick="guiaSel='geral'; renderGuia()">Definições gerais de processo e produto</button>
      <div class="guia-nav-title" style="margin-top:8px">Critérios por setor (CNAE)</div>
      ${GUIA.grupos.map((g, i) => `
        <button class="guia-item ${guiaSel === i ? 'active' : ''}" onclick="guiaSel=${i}; renderGuia()">
          <span class="divs">${g.divisoes.join(' · ')}</span>
          ${esc(g.nome)}
          <span class="count">${contaPat(i)} das 250 patentes</span>
        </button>`).join('')}`;

    const q = (document.getElementById('guia-q')?.value || '').trim();
    let head, body;
    if (guiaSel === 'geral') {
      head = `<h2>Definições gerais</h2>`;
      body = colunasGerais(q);
    } else {
      const g = GUIA.grupos[guiaSel];
      head = `<h2>${esc(g.nome)}</h2><div>${g.divisoes.map(d => `<span class="div-chip">CNAE ${d}</span>`).join('')}</div>`;
      body = colunas(g, q);
    }
    main.innerHTML = `
      <div class="guia-head">
        ${head}
        <input class="search-input guia-search" id="guia-q" placeholder="🔍  Filtrar critérios (ex.: embalagem, software, insumo)..." value="${esc(q)}" oninput="renderGuiaBody()" />
      </div>
      <div id="guia-body">${body}</div>`;
  }

  function renderGuiaBody() {
    const q = document.getElementById('guia-q').value.trim();
    document.getElementById('guia-body').innerHTML =
      guiaSel === 'geral' ? colunasGerais(q) : colunas(GUIA.grupos[guiaSel], q);
  }

  function critPanel(p) {
    if (!GUIA) return '';
    const gs = gruposDoSetor(p.isic);
    const aberto = localStorage.getItem('patent-crit-open') === '1';
    const toggle = `ontoggle="localStorage.setItem('patent-crit-open', this.open ? '1' : '0')"`;
    if (!gs.length) {
      return `
      <details class="crit-box" ${aberto ? 'open' : ''} ${toggle}>
        <summary><span class="arrow">▶</span> 📖 Critérios do setor <span class="sector">ISIC ${esc(p.isic)}: sem grupo setorial correspondente na guia</span>
          <button class="open-guia" onclick="abrirGuia('geral', event)">Ver definições gerais →</button></summary>
      </details>`;
    }
    return gs.map(({ g, i }) => `
      <details class="crit-box" ${aberto ? 'open' : ''} ${toggle}>
        <summary><span class="arrow">▶</span> 📖 Critérios do setor <span class="sector">CNAE ${esc(p.isic)} · ${esc(g.nome)}</span>
          <button class="open-guia" onclick="abrirGuia(${i}, event)">Abrir na guia →</button></summary>
        <div class="crit-body">${colunas(g, '')}</div>
      </details>`).join('');
  }

  // ─── Helpers ─────────────────────────────────────────────────
  const LABELS = { produto: 'Produto', processo: 'Processo', indefinido: 'Ambígua' };
  const LABELS_FULL = { produto: 'Inovação de Produto', processo: 'Inovação de Processo', indefinido: 'Ambígua' };

  // Palavras que costumam indicar cada tipo de inovação (apenas apoio visual)
  const KW_PROC = /(?<!\p{L})(processos?|métodos?|procedimentos?|produção|fabricação|preparação|obtenção|síntese|tratamento|etapas?|manufatura|operação|operar|produzir|fabricar|preparar|obter|controle|controlar|técnica|uso|utilização|aplicação|reciclagem|purificação|extração)(?!\p{L})/giu;
  const KW_PROD = /(?<!\p{L})(produtos?|dispositivos?|aparelhos?|equipamentos?|máquinas?|sistemas?|composições?|compostos?|formulações?|materia(?:l|is)|conjuntos?|estruturas?|artigos?|kits?|sensor(?:es)?|ferramentas?|peças?|componentes?|módulos?|veículos?|embalagens?|recipientes?|mecanismos?|vacinas?|cápsulas?|placas?|folhas?|chapas?)(?!\p{L})/giu;

  function highlight(html) {
    if (!document.getElementById('hl-toggle')?.checked) return html;
    return html
      .replace(KW_PROC, '<mark class="kw-proc">$&</mark>')
      .replace(KW_PROD, '<mark class="kw-prod">$&</mark>');
  }

  function fmtDate(d) {
    return /^\d{8}$/.test(d) ? `${d.slice(6, 8)}/${d.slice(4, 6)}/${d.slice(0, 4)}` : d;
  }

  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
